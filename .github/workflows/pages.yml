name: Build and deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (no optional)
        run: |
          npm ci --no-optional || npm install --no-optional
      - name: Install rollup native for Linux
        run: |
          if [ "$(uname -s)" = "Linux" ]; then npm i @rollup/rollup-linux-x64-gnu --no-save; fi
      - name: Build
        run: npm run build --if-present
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist